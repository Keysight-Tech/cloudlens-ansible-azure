# =====================================================================
# High-scale Ansible config, tuned for 1000+ VMs
# =====================================================================
# Copy over ansible.cfg before a scaled deployment:
#   cp deploy/tuned-ansible.cfg ansible.cfg
#
# Comments sit on their own lines on purpose: Ansible's INI parser keeps
# anything after a value, "# comment" included, as part of that value, and an
# inline comment after "forks = 200" stopped every ansible command.
# =====================================================================

[defaults]
inventory = inventory/azure_rm.yaml
# default parallelism, override with --forks
forks = 200
host_key_checking = False
log_path = ./ansible.log
# generous for slow VMs
timeout = 60
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
# hosts run independently, so slow ones do not block the rest
strategy = free
interpreter_python = auto_silent
# ansible-core's own callback with YAML output; community.general removed the
# old "yaml" stdout callback, which made every run fail at startup
stdout_callback = default
callback_result_format = yaml
# Per-task timing needs the ansible.posix collection, which is not installed.
# To use it: ansible-galaxy collection install ansible.posix, then
#   callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer

[inventory]
enable_plugins = azure.azcollection.azure_rm, constructed, auto, host_list, yaml, ini

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o PreferredAuthentications=publickey
# eliminates intermediate SSH steps (30-40% speedup)
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
retries = 3

[persistent_connection]
connect_timeout = 60
command_timeout = 60

[colors]
ok = green
changed = yellow
unreachable = bright red
failed = bright red
skipped = cyan
