---
# The Docker image installs exactly these ranges. Upper bounds matter: an open
# ">=" pulls whatever is newest on the next build.
#   - ansible-core stays on 2.16 in the image (RHEL 7/8 targets, see the
#     Dockerfile), so every collection must still support 2.16.
#   - community.general 11+ needs ansible-core 2.17+, and 12 removed the yaml
#     stdout callback; 13.3.0 slipped into the image and declared >=2.18.
#   - azure.azcollection 4.0.0 is a major release; take it deliberately.
collections:
  - name: azure.azcollection
    version: ">=3.0.0,<4.0.0"
  - name: ansible.windows
    version: ">=2.0.0,<4.0.0"
  - name: community.windows
    version: ">=2.0.0,<4.0.0"
  - name: community.general
    version: ">=8.0.0,<11.0.0"
